name: Build All Platforms
on: [push]
jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fix missing prepare option
        run: |
          if [ ! -f meson_options.txt ]; then
            echo "option('prepare', type : 'boolean', value : false)" > meson_options.txt
          elif ! grep -q "prepare" meson_options.txt; then
            echo "option('prepare', type : 'boolean', value : false)" >> meson_options.txt
          fi
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential python3-pip pkg-config libluajit-5.1-dev libcurl4-openssl-dev libfftw3-dev zlib1g-dev libsdl2-dev libbz2-dev libjsoncpp-dev ninja-build
          pip3 install meson
      - name: Build
        run: |
          meson setup build --buildtype=release
          meson compile -C build
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fix missing prepare option
        shell: bash
        run: |
          if [ ! -f meson_options.txt ]; then
            echo "option('prepare', type : 'boolean', value : false)" > meson_options.txt
          elif ! grep -q "prepare" meson_options.txt; then
            echo "option('prepare', type : 'boolean', value : false)" >> meson_options.txt
          fi
          cat meson_options.txt
      - name: Install Meson
        run: pip install meson ninja
      - name: Build
        run: |
          meson setup build --buildtype=release
          meson compile -C build
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/