name: Build

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix all missing meson options
        run: |
          python3 << 'PY'
          import re, pathlib
          build = pathlib.Path("meson.build").read_text()
          opts_path = pathlib.Path("meson_options.txt")
          opts = opts_path.read_text() if opts_path.exists() else ""
          needed = set(re.findall(r"get_option\s*\(\s*['\"]([^'\"]+)['\"]", build))
          existing = set(re.findall(r"option\s*\(\s*['\"]([^'\"]+)['\"]", opts))
          missing = needed - existing
          print(f"Needed: {needed}")
          print(f"Existing: {existing}")
          print(f"Missing: {missing}")
          for name in missing:
              opts += f"\noption('{name}', type : 'boolean', value : false, description : 'auto-added missing option')\n"
          opts_path.write_text(opts)
          print("Fixed meson_options.txt")
          PY

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential python3-pip pkg-config libluajit-5.1-dev libcurl4-openssl-dev libfftw3-dev zlib1g-dev libsdl2-dev libbz2-dev libjsoncpp-dev libfreetype6-dev libpng-dev ninja-build git
          pip3 install meson

      - name: Build
        run: |
          meson setup build --buildtype=release
          meson compile -C build -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix all missing meson options
        run: |
          python - << 'PY'
          import re, pathlib
          build = pathlib.Path("meson.build").read_text()
          opts_path = pathlib.Path("meson_options.txt")
          opts = opts_path.read_text() if opts_path.exists() else ""
          needed = set(re.findall(r"get_option\s*\(\s*['\"]([^'\"]+)['\"]", build))
          existing = set(re.findall(r"option\s*\(\s*['\"]([^'\"]+)['\"]", opts))
          missing = needed - existing
          print(f"Missing: {missing}")
          for name in missing:
              opts += f"\noption('{name}', type : 'boolean', value : false, description : 'auto-added missing option')\n"
          opts_path.write_text(opts)
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        run: |
          pip install meson
          meson setup build --buildtype=release -Dprepare=true
          meson setup build --buildtype=release --reconfigure
          meson compile -C build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/